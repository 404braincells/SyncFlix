
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111114">
    <title>SyncFlix - Watch Movies Together</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a class="logo" href="#home">sync<span>flix</span></a>

        <nav>
            <a href="#home">Home</a>
            <a href="#movies">Discover</a>
            <a href="#watchlist">My List</a>
        </nav>

        <button id="create-room">Create Room</button>
    </header>

    <main id="home">
        <section class="hero">
            <p class="eyebrow">Movies are better with friends</p>
            <h1>Your next movie<br>night awaits here</h1>
            <p class="subtitle">
                Discover something great together.
                Invite your friends and watch together, wherever you are.
            </p>
            <button id="explore">Explore Movies ↓</button>
        </section>

        <section id="movies" class="catalog">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">YOUR NEXT OBSESSION</p>
                    <h2>Discover Movies</h2>
                </div>

                <input
                    id="search"
                    type="search"
                    placeholder="Search for a movie"
                    autocomplete="off"
                >
            </div>

            <div id="movie-grid" class="movie-grid">
                <!-- Movie cards will be added by JavaScript -->
            </div>
        </section>

        <section id="watchlist" class="catalog">
            <h2>My Watchlist</h2>
            <div id="watchlist-grid" class="movie-grid">
                <!-- Saved movies will appear here -->
            </div>
        </section>
    </main>

    <footer>
        <a class="logo" href="#home">sync<span>flix</span></a>
        <p>Great stories, shared moments.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
